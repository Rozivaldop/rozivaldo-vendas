<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rozivaldo Store · Catálogo</title>
<meta name="theme-color" content="#111111">
<meta name="description" content="Moda, lingerie e sex shop com marcas selecionadas. Pague no Pix.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f5f5f6;--line:#e6e6e9;--tx:#111;--mut:#6b7280;--ink:#111;--ok:#16a34a;--bad:#dc2626;--r:14px}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
small{color:var(--mut)}
.top{background:#111;color:#fff;font-size:11.5px;letter-spacing:1.4px;text-align:center;padding:6px 10px;font-weight:600;text-transform:uppercase}
/* cabeçalho */
.hd{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 14px rgba(0,0,0,.06)}
.hdi{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px}
.burger{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:1.2rem}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo svg{width:40px;height:40px}.logo b{display:block;font-size:1.08rem;letter-spacing:.06em;line-height:1}.logo small{display:block;font-size:.56rem;letter-spacing:.14em;margin-top:3px}
.sr{flex:1;max-width:620px;margin:0 auto;position:relative}
.sr input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:0 44px 0 18px;font:inherit;outline:none}
.sr input:focus{border-color:#111;background:#fff}
.sr span{position:absolute;right:16px;top:50%;transform:translateY(-50%);opacity:.55;pointer-events:none}
.cartb{position:relative;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:800;font-size:13px;flex:none}
.cartb svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cartb i{font-style:normal;position:absolute;top:-5px;left:26px;min-width:20px;height:20px;border-radius:99px;background:#dc2626;color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
.cartb small{color:#fff;font-size:.82rem}
.nv{border-top:1px solid var(--line)}
.nvi{max-width:1280px;margin:0 auto;padding:0 18px;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.nvi button{background:none;border:0;padding:12px 14px;font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border-bottom:2px solid transparent}
.nvi button:hover,.nvi button.on{border-bottom-color:#111}
.nvi .sp{flex:1}
/* estrutura */
.shell{max-width:1280px;margin:0 auto;padding:22px 18px 40px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:30px;align-items:start}
.side{position:sticky;top:122px;max-height:calc(100vh - 140px);overflow:auto;padding-right:6px;scrollbar-width:thin}
.side h4{margin:18px 0 8px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.side h4:first-child{margin-top:0}
.sl{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;font-size:.92rem}
.sl:hover{background:var(--soft)}.sl.on{background:#111;color:#fff}.sl.on small{color:#cfcfd4}
.sl small{font-size:.74rem}
.ss{margin:2px 0 6px 14px;padding-left:10px;border-left:2px solid var(--line)}
.ss .sl{padding:7px 10px;font-size:.86rem}
.sb{display:flex;align-items:center;gap:10px}
.sb .lg{width:42px;height:28px;border-radius:7px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:.62rem;font-weight:800}
.sb .lg img{max-width:88%;max-height:88%;object-fit:contain}
.sl.on .lg{border-color:#fff}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;background:#111;color:#fff;border-radius:22px;overflow:hidden;min-height:340px}
.hero .tx{padding:44px 40px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.hero .tg{font-size:.72rem;letter-spacing:.22em;color:#bdbdc4;text-transform:uppercase}
.hero h1{margin:0;font-size:clamp(2rem,4.2vw,3.4rem);line-height:1.02;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:#cfcfd4;max-width:420px;line-height:1.5}
.hero .go{align-self:flex-start;background:#fff;color:#111;border:0;border-radius:999px;padding:14px 26px;font-weight:700;letter-spacing:.04em;margin-top:6px}
.hero .go:hover{background:#e9e9ec}
.col{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:3px;background:#111}
.col>div{background:#2a2a2e center/cover;min-height:170px}
.col .ph0{display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:linear-gradient(135deg,#222,#3a3a40)}
/* benefícios */
.bf{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 8px}
.bf>div{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center}
.bf .i{font-size:1.5rem;width:46px;height:46px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.bf b{display:block;font-size:.9rem}.bf small{font-size:.76rem;line-height:1.3;display:block}
/* seções */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:34px 0 14px}
.sh h2{margin:0;font-size:.95rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.sh button{background:none;border:0;font-size:.8rem;font-weight:600;text-decoration:underline}
.brs{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.brs::-webkit-scrollbar,.ccs::-webkit-scrollbar{display:none}
.bt{flex:none;width:132px;height:84px;border:1px solid var(--line);border-radius:var(--r);background:#fff;display:flex;align-items:center;justify-content:center;transition:.18s;padding:8px;font-weight:800}
.bt:hover{border-color:#111;transform:translateY(-3px);box-shadow:0 8px 22px #0001}
.bt img{max-width:90%;max-height:90%;object-fit:contain}
.ccs{display:flex;gap:22px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.cc{flex:none;width:108px;background:none;border:0;text-align:center}
.cc .cp{width:108px;height:108px;border-radius:50%;background:var(--soft) center/cover;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:2.2rem;transition:.18s}
.cc:hover .cp{border-color:#111;transform:scale(1.04)}
.cc b{display:block;margin-top:8px;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase}
.cc small{font-size:.68rem}
/* produtos */
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.pc{display:flex;flex-direction:column;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{position:relative;aspect-ratio:3/4;background:var(--soft);border-radius:var(--r);overflow:hidden;cursor:pointer}
.ph>img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.pc:hover .ph>img{transform:scale(1.04)}
.ph .pimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem}
.tg{position:absolute;top:10px;left:10px;background:#111;color:#fff;font-size:.66rem;font-weight:700;letter-spacing:.1em;padding:4px 9px;border-radius:6px}
.nf{position:absolute;top:10px;right:10px;background:#fffd;font-size:.7rem;padding:3px 8px;border-radius:99px}
.mb{position:absolute;left:10px;bottom:10px;width:46px;height:32px;background:#fff;border-radius:8px;box-shadow:0 2px 8px #0002;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;overflow:hidden}
.mb img{max-width:90%;max-height:90%;object-fit:contain}
.pi{padding:12px 2px 0;display:flex;flex-direction:column;gap:4px;flex:1}
.mn{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.pn{margin:0;font-size:.92rem;font-weight:600;line-height:1.3;min-height:2.6em}
.pp{font-size:1.12rem;font-weight:800}
.tm{font-size:.72rem;color:var(--mut)}
.add{margin-top:8px;width:100%;padding:12px;border:1.5px solid #111;background:#111;color:#fff;border-radius:10px;font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;transition:.15s}
.add:hover{background:#fff;color:#111}
.add.ghost{background:#fff;color:#111}.add.ghost:hover{background:#111;color:#fff}
.add.in{background:#16a34a;border-color:#16a34a;color:#fff}
/* lista */
.bc{font-size:.8rem;color:var(--mut);margin-bottom:10px}.bc button{background:none;border:0;padding:0;color:var(--mut);text-decoration:underline}
.lh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lh h1{margin:0;font-size:1.6rem;letter-spacing:-.01em}
.lh select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff}
.chs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:.82rem}
.chs button.on{background:#111;border-color:#111;color:#fff}
.bn{display:flex;align-items:center;gap:16px;background:var(--soft);border-radius:var(--r);padding:14px 18px;margin-bottom:14px}
.bn .lg{width:96px;height:62px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:800}
.bn .lg img{max-width:90%;max-height:90%;object-fit:contain}
.bn h2{margin:0}
.vz{text-align:center;padding:50px 16px;color:var(--mut)}
/* como comprar + rodapé */
.como{background:var(--soft);margin-top:44px}
.comoi{max-width:1280px;margin:0 auto;padding:40px 18px}
.como h2{margin:0 0 20px;text-align:center;font-size:.95rem;letter-spacing:.16em;text-transform:uppercase}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.steps3>div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;text-align:center}
.steps3 .n{width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:12px}
.steps3 b{display:block;margin-bottom:4px}.steps3 small{line-height:1.4;display:block}
.ctab{margin-top:22px;background:#111;color:#fff;border-radius:22px;padding:30px 34px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.ctab b{display:block;font-size:1.35rem;margin-bottom:4px}.ctab span{color:#cfcfd4}
.ctab .btn{background:#fff;color:#111;border-color:#fff}.ctab .btn:hover{background:#e9e9ec}
.ft{background:#0b0b0d;color:#bdbdc4}
.fti{max-width:1280px;margin:0 auto;padding:44px 18px 30px;display:grid;grid-template-columns:1.3fr .8fr 1.2fr 1.1fr;gap:34px}
.ft h5{margin:0 0 14px;color:#fff;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase}
.ft .fl{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ft .fl svg{width:42px;height:42px}.ft .fl b{display:block;color:#fff;letter-spacing:.06em;line-height:1.05}.ft .fl small{display:block;color:#8a8a92;font-size:.58rem;letter-spacing:.14em;margin-top:3px}
.ft p{margin:0 0 14px;line-height:1.6;font-size:.9rem}
.ft a,.ft button.l{display:block;background:none;border:0;color:#bdbdc4;padding:5px 0;text-decoration:none;text-align:left;font-size:.9rem;cursor:pointer}
.ft a:hover,.ft button.l:hover{color:#fff}
.ft .soc{display:flex;gap:10px;flex-wrap:wrap}
.ft .soc a{display:inline-flex;align-items:center;gap:8px;border:1px solid #2c2c31;border-radius:999px;padding:9px 16px;color:#fff;font-size:.84rem}
.ft .soc a:hover{background:#fff;color:#111}
.fmarcas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fmarcas button{height:50px;background:#fff;border:0;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:6px;font-weight:800;color:#111;transition:.15s}
.fmarcas button:hover{transform:translateY(-2px)}.fmarcas img{max-width:92%;max-height:92%;object-fit:contain}
.pays{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.pays span{border:1px solid #2c2c31;border-radius:8px;padding:6px 12px;font-size:.8rem;color:#fff}
.fi{font-size:.86rem;line-height:1.5;margin:0 0 8px;display:flex;gap:8px}
.ft .cp{max-width:1280px;margin:0 auto;padding:16px 18px;border-top:1px solid #222226;font-size:.78rem;color:#7b7b83;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ft .cp button{background:none;border:1px solid #2c2c31;color:#fff;border-radius:999px;padding:8px 16px;font-size:.78rem}
.ft .cp button:hover{background:#fff;color:#111}
/* gaveta do carrinho / menu */
.scrim{position:fixed;inset:0;background:#0008;z-index:50;opacity:0;pointer-events:none;transition:.2s}
body.menu .scrim,body.cart .scrim{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:60;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-10px 0 40px #0003}
body.cart .drw{transform:none}
.drh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drh h3{margin:0;font-size:1rem;letter-spacing:.1em;text-transform:uppercase}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff}
.drb{flex:1;overflow:auto;padding:6px 18px}
.drf{border-top:1px solid var(--line);padding:16px 18px;background:#fafafa}
.ci{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ci .im{width:72px;height:92px;border-radius:10px;background:var(--soft) center/cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.ci .in{flex:1;min-width:0}.ci b{display:block;font-size:.9rem;line-height:1.25}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.qty button{width:34px;height:34px;border:0;background:none;font-size:1.1rem}
.qty span{min-width:26px;text-align:center;font-weight:600}
.rm{background:none;border:0;color:var(--mut);font-size:.78rem;text-decoration:underline;margin-left:12px}
.tr{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.tr.t{font-size:1.2rem;font-weight:800}
.btn{display:inline-block;background:#111;color:#fff;border:1.5px solid #111;border-radius:12px;padding:14px 20px;font-weight:700;letter-spacing:.03em;text-align:center}
.btn:hover{background:#2a2a2e}.btn.w{width:100%}.btn.alt{background:#fff;color:#111}.btn.alt:hover{background:var(--soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* modal */
.bk{position:fixed;inset:0;background:#000a;z-index:70;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.sheet{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:calc(100vh - 28px);overflow:auto;padding:20px;position:relative}
.sheet.det{padding:0;max-width:980px;overflow:hidden}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.shh h2{margin:0}
.inp{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;margin:5px 0;outline:none}
.inp:focus{border-color:#111}
.sheet h3{margin:18px 0 8px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.mut{color:var(--mut)}
/* detalhe */
.dt{display:grid;grid-template-columns:1.1fr 1fr}
.gwrap{position:relative;background:#f1f1f3}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:3/4;max-height:78vh}
.gal::-webkit-scrollbar{display:none}
.gs{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}
.gs img{width:100%;height:100%;object-fit:contain}.gs .pimg{font-size:4rem}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:#fffe;font-size:1.6rem;line-height:1;box-shadow:0 2px 10px #0003}
.gnav.l{left:10px}.gnav.r{right:10px}
.gcount{position:absolute;right:12px;bottom:12px;background:#111c;color:#fff;font-size:.75rem;padding:3px 10px;border-radius:99px}
.gthumbs{display:flex;gap:8px;padding:10px;overflow-x:auto;scrollbar-width:none;background:#fff}
.gt{flex:none;width:56px;height:70px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--soft);opacity:.6}
.gt.on{border-color:#111;opacity:1}.gt img{width:100%;height:100%;object-fit:cover}
.dti{padding:26px 26px 22px;display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:90vh}
.dti .lg{width:84px;height:54px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:800}
.dti .lg img{max-width:90%;max-height:90%;object-fit:contain}
.dti h2{margin:6px 0 0;font-size:1.5rem;line-height:1.2}
.dti .pr{font-size:1.7rem;font-weight:800;margin:6px 0}
.lbl2{margin-top:14px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.szs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sz{min-width:50px;padding:11px 14px;background:#fff;border:1.5px solid var(--line);border-radius:10px;font-weight:600}
.sz.on{background:#111;border-color:#111;color:#fff}
.nota2{margin-top:12px;padding:12px 14px;background:var(--soft);border-radius:12px;font-size:.88rem}
.dgx{position:absolute;top:12px;right:12px;z-index:3;background:#fff;box-shadow:0 2px 10px #0003;border:0}
/* checkout */
.ck h3:first-of-type{margin-top:8px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;cursor:pointer}
.opt.on{border-color:#111;background:#fafafa}
.opt input{accent-color:#111;width:18px;height:18px}
.opt span{flex:1}.opt b{display:block}.opt small{display:block;font-size:.78rem}
.ent{background:var(--soft);border-radius:12px;padding:12px;margin:-2px 0 8px}
.ent .chs{margin:6px 0}
.res{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.88rem}
.res .tr{margin:3px 0}
.pixb{text-align:center}
.pixb .v{font-size:2rem;font-weight:800;margin:4px 0 10px}
.qr{width:220px;max-width:70%;margin:10px auto;background:#fff;padding:8px;border:1px solid var(--line);border-radius:14px}
.qr svg{width:100%;height:auto;display:block}
.cola{width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;padding:10px;font:.72rem/1.35 ui-monospace,Menlo,monospace;background:var(--soft);resize:none;word-break:break-all}
.steps{text-align:left;margin:12px 0;padding-left:20px;font-size:.88rem;line-height:1.6;color:#333}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:12px 18px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:.25s;display:flex;gap:14px;align-items:center;font-size:.9rem}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:#fff;text-decoration:underline;font-weight:700}
.sk{aspect-ratio:3/4;border-radius:var(--r);background:linear-gradient(90deg,#f1f1f3 25%,#e8e8eb 50%,#f1f1f3 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* responsivo */
@media(max-width:980px){.bf{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.hero .col{display:none}.hero .tx{padding:32px 24px}.dt{grid-template-columns:1fr}.fti{grid-template-columns:1fr 1fr}.steps3{grid-template-columns:1fr}}
@media(max-width:900px){
 .burger{display:block}.nv{display:none}.shell{grid-template-columns:minmax(0,1fr);padding:14px 14px 30px}

<script src="config.js"></script>
<script>
// ===== CONFIGURAÇÕES DA LOJA =====
// WhatsApp da loja com DDD (ex: "84999998888"). Se preencher, aparece o botão "enviar comprovante no WhatsApp".
const WHATS_LOJA = "";
// Opcionais: aparecem no rodapé só se você preencher
const INSTAGRAM_LOJA = "";   // ex: "rozivaldostore" (sem @)
const ENDERECO_LOJA = "";    // ex: "Rua das Flores, 123 - Cidade/UF"
const HORARIO_LOJA = "";     // ex: "Seg a Sáb, das 9h às 18h"
// Dados do Pix (chave aleatória cadastrada no banco)
const PIX = { chave: '47ae918d-9526-4b0b-a622-46273a874482', nome: 'ROZIVALDO STORE', cidade: 'BRASIL' };

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const R = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nz = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const sku = p => p.sku || 'RS' + String(p.id).replace(/-/g, '').slice(0, 8).toUpperCase();
const CATS = ['Masculino', 'Feminino', 'Lingerie', 'Sexshop'];
const IC = { Masculino: '👔', Feminino: '👗', Lingerie: '💗', Sexshop: '🔥' };
const mkId = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join('');

let P = [], SC = [], MC = [], V = { a: '', s: '', m: '', q: '', o: 'novos', v: '', c: '' }, GAL = { id: '', fotos: [], tam: '' }, CK = { passo: 1, nome: '', tel: '', obs: '', forma: 'pix_total', pct: 50, outro: '' }, tmrBusca = null;
const mById = id => MC.find(m => m.id == id);
const logoM = m => m.logo ? `<img src="${esc(m.logo)}" alt="${esc(m.nome)}" loading="lazy">` : `<span>${esc(m.nome.slice(0, 2).toUpperCase())}</span>`;

/* ---------- carrinho (guardado no aparelho) ---------- */
function lerCart() { try { const o = JSON.parse(localStorage.getItem('rs_cart') || '{}'); return Object.fromEntries(Object.entries(o).filter(([, q]) => Number.isInteger(q) && q > 0)); } catch (e) { return {}; } }
let cart = lerCart();
const salvaCart = () => { try { localStorage.setItem('rs_cart', JSON.stringify(cart)); } catch (e) {} };
const keyOf = (id, tam) => tam ? id + '::' + tam : id;
const prodDe = k => P.find(p => p.id == k.split('::')[0]);
const tamDe = k => k.includes('::') ? k.split('::').slice(1).join('::') : '';
const qtdProd = id => Object.entries(cart).filter(([k]) => k.split('::')[0] == id).reduce((a, [, q]) => a + q, 0);
const linhas = () => Object.entries(cart).map(([k, q]) => ({ k, q, p: prodDe(k), tam: tamDe(k) })).filter(x => x.p);
const total = () => Math.round(linhas().reduce((t, x) => t + x.q * Number(x.p.preco), 0) * 100) / 100;
const nItens = () => linhas().reduce((a, x) => a + x.q, 0);
const temTam = p => (p.tamanhos || []).length > 0;
const rotulo = x => esc(x.p.nome) + (x.tam ? ' · ' + esc(x.tam) : x.p.tam_consulta ? ' <small>(tamanho a confirmar)</small>' : '');
function mud(k, d) {
  cart[k] = (cart[k] || 0) + d; if (cart[k] <= 0) delete cart[k];
  salvaCart(); updHeader(); cartRender();
  const id = k.split('::')[0]; document.querySelectorAll('[data-add="' + id + '"]').forEach(b => { const p = P.find(x => x.id == id); if (p) { b.className = 'add ' + addCls(p); b.innerHTML = addLabel(p); } });
}
function remover(k) { delete cart[k]; salvaCart(); updHeader(); cartRender(); const id = k.split('::')[0]; document.querySelectorAll('[data-add="' + id + '"]').forEach(b => { const p = P.find(x => x.id == id); if (p) { b.className = 'add ' + addCls(p); b.innerHTML = addLabel(p); } }); }
function toast(msg, acao, fn) {
  const t = $('#toast'); t.innerHTML = esc(msg) + (acao ? `<button onclick="${fn}">${acao}</button>` : ''); t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 3200);
}
function updHeader() { $('#cn').textContent = nItens(); $('#cn').hidden = !nItens(); $('#ct').textContent = R(total()); }

/* ---------- carregamento ---------- */
let AN = [], CFG = {}, HERO_T = null;
const cfg = (k, d = '') => (CFG[k] != null && CFG[k] !== '' ? CFG[k] : d);
const whats = () => cfg('whatsapp', WHATS_LOJA);
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
async function init() {
  const [r, s, m, a, c] = await Promise.all([db.from('produtos').select('*').eq('vitrine', true).order('nome'), db.from('subcategorias').select('*').order('nome'), db.from('marcas').select('*').order('nome'), db.from('anuncios').select('*').order('ordem'), db.from('configuracoes').select('*')]);
  if (r.error) { $('#main').innerHTML = '<div class="vz">Não foi possível carregar o catálogo agora. Tente novamente em instantes.</div>'; return; }
  P = r.data || []; SC = s.data || []; MC = m.data || []; AN = a.data || []; CFG = Object.fromEntries((c.data || []).map(x => [x.chave, x.valor]));
  for (const k of Object.keys(cart)) if (!prodDe(k)) delete cart[k];
  salvaCart(); lerHash(); render();
}
function lerHash() { const p = new URLSearchParams(location.hash.slice(1)); V = { a: p.get('a') || '', s: p.get('s') || '', m: p.get('m') || '', q: p.get('q') || '', o: p.get('o') || 'novos', v: p.get('v') || '', c: p.get('c') || '' }; const i = $('#q'); if (i && document.activeElement !== i) i.value = V.q; }
function nav(o, sub) {
  V = { ...V, ...o };
  if (('a' in o || 'm' in o || 'q' in o || 's' in o) && !('v' in o)) { V.v = ''; V.c = ''; }
  if ('a' in o && !('s' in o)) V.s = '';
  if (o.v) { V.a = ''; V.s = ''; V.m = ''; V.q = ''; }
  const p = new URLSearchParams(); for (const k of ['a', 's', 'm', 'q', 'v', 'c']) if (V[k]) p.set(k, V[k]); if (V.o != 'novos') p.set('o', V.o);
  const h = p.toString(); history[sub ? 'replaceState' : 'pushState'](null, '', location.pathname + location.search + (h ? '#' + h : ''));
  menu(false); fechaCarrinho(); render(); if (!sub) window.scrollTo({ top: 0, behavior: 'smooth' }); const i = $('#q'); if (i && document.activeElement !== i) i.value = V.q;
}
window.addEventListener('popstate', () => { lerHash(); render(); });
function buscar(v) { clearTimeout(tmrBusca); tmrBusca = setTimeout(() => { V.q = v.trim(); V.v = ''; V.c = ''; if (V.q) { V.a = ''; V.s = ''; V.m = ''; } nav({}, true); }, 220); }
function irPara(id) { menu(false); if (!isHome()) nav({ a: '', s: '', m: '', q: '' }); setTimeout(() => { const e = document.getElementById(id); if (e) e.scrollIntoView({ behavior: 'smooth' }); }, 120); }
function menu(on) { document.body.classList.toggle('menu', !!on); if (on) document.body.classList.remove('cart'); }

/* ---------- utilidades de listagem ---------- */
const isHome = () => !V.v && !V.a && !V.s && !V.m && !V.q;
const dia = p => String(p.criado_em || '').slice(0, 10);
function baseDia() { const c = {}; P.forEach(p => { const d = dia(p); if (d) c[d] = (c[d] || 0) + 1; }); const t = Object.entries(c).sort((a, b) => b[1] - a[1])[0]; return t && t[1] > P.length / 2 && P.length > 4 ? t[0] : ''; }
const novo = (p, bd) => p.criado_em && Date.now() - new Date(p.criado_em) < 14 * 864e5 && dia(p) != bd;
function ordenar(l, o) {
  const a = [...l];
  if (o == 'menor') a.sort((x, y) => x.preco - y.preco); else if (o == 'maior') a.sort((x, y) => y.preco - x.preco); else if (o == 'nome') a.sort((x, y) => x.nome.localeCompare(y.nome));
  else a.sort((x, y) => String(y.criado_em || '').localeCompare(String(x.criado_em || '')) || x.nome.localeCompare(y.nome));
  return a;
}
const areasComProd = () => CATS.filter(k => P.some(p => p.categoria == k));
const subsDe = a => { const l = P.filter(p => p.categoria == a), ord = SC.filter(s => s.area == a).map(s => s.nome), ex = [...new Set(l.map(p => p.subcategoria).filter(Boolean))].filter(n => !ord.includes(n)); return [...ord, ...ex].filter(n => l.some(p => p.subcategoria == n)); };
function filtrar() {
  const q = nz(V.q.trim());
  return P.filter(p => (!V.a || p.categoria == V.a) && (!V.s || (V.s == '__outros' ? !p.subcategoria : p.subcategoria == V.s)) && (!V.m || p.marca_id == V.m) && (!q || nz(p.nome + ' ' + sku(p) + ' ' + (p.subcategoria || '') + ' ' + p.categoria + ' ' + ((mById(p.marca_id) || {}).nome || '')).includes(q)));
}
const marcasDe = l => MC.map(m => ({ m, n: l.filter(p => p.marca_id == m.id).length })).filter(x => x.n);

/* ---------- cartões de produto ---------- */
const addCls = p => temTam(p) ? 'ghost' : qtdProd(p.id) ? 'in' : '';
const addLabel = p => temTam(p) ? (qtdProd(p.id) ? '✓ ' + qtdProd(p.id) + ' no carrinho · opções' : 'Ver opções') : qtdProd(p.id) ? '✓ ' + qtdProd(p.id) + ' no carrinho · +1' : 'Adicionar';
function addRapido(id) { const p = P.find(x => x.id == id); if (!p) return; if (temTam(p)) return detalhe(id); mud(id, 1); toast('Adicionado ao carrinho', 'Ver carrinho', 'abrirCarrinho()'); }
function card(p, bd) {
  const m = mById(p.marca_id);
  return `<article class="pc"><div class="ph" onclick="detalhe('${p.id}')">${p.foto ? `<img src="${p.foto}" alt="${esc(p.nome)}" loading="lazy">` : '<div class="pimg">🛍️</div>'}${novo(p, bd) ? '<span class="tg">NOVO</span>' : ''}${p.n_fotos > 1 ? `<span class="nf">📷 ${p.n_fotos}</span>` : ''}${m ? `<span class="mb">${logoM(m)}</span>` : ''}</div>
  <div class="pi">${m ? `<span class="mn">${esc(m.nome)}</span>` : ''}<h3 class="pn">${esc(p.nome)}</h3><div class="pp">${R(p.preco)}</div>${temTam(p) ? `<span class="tm">Tam: ${p.tamanhos.map(esc).join(' · ')}</span>` : p.tam_consulta ? '<span class="tm">📏 Consulte o tamanho</span>' : ''}
  <button class="add ${addCls(p)}" data-add="${p.id}" onclick="addRapido('${p.id}')">${addLabel(p)}</button></div></article>`;
}

/* ---------- menu lateral e navegação ---------- */
function sideHtml() {
  const as = areasComProd(), mv = marcasDe(P);
  return `<h4>Navegar</h4>
  <button class="sl ${isHome() ? 'on' : ''}" onclick="nav({a:'',s:'',m:'',q:''})"><span>🏠 Início</span></button>
  <button class="sl" onclick="irPara('novidades')"><span>✨ Novidades</span></button>
  <h4>Categorias</h4>
  ${as.map(k => { const n = P.filter(p => p.categoria == k).length, subs = subsDe(k); return `<button class="sl ${V.a == k && !V.s ? 'on' : ''}" onclick="nav({a:'${k}',s:'',m:''})"><span>${IC[k]} ${k}</span><small>${n}</small></button>
    ${V.a == k && subs.length ? `<div class="ss">${subs.map(s => `<button class="sl ${V.s == s ? 'on' : ''}" data-s="${esc(s)}" onclick="nav({s:this.dataset.s})"><span>${esc(s)}</span><small>${P.filter(p => p.categoria == k && p.subcategoria == s).length}</small></button>`).join('')}</div>` : ''}`; }).join('')}
  ${mv.length ? `<h4>Marcas</h4>${mv.map(({ m, n }) => `<button class="sl ${V.m == m.id ? 'on' : ''}" onclick="nav({m:'${m.id}',q:''})"><span class="sb"><span class="lg">${logoM(m)}</span>${esc(m.nome)}</span><small>${n}</small></button>`).join('')}` : ''}
  <h4>Ajuda</h4>
  <button class="sl ${V.v == 'acompanhar' ? 'on' : ''}" onclick="nav({v:'acompanhar'})"><span>📦 Acompanhar pedido</span></button>
  <button class="sl" onclick="abrirSug()"><span>💡 Pedir um produto</span></button>
  <button class="sl" onclick="menu(false);abrirCarrinho()"><span>🛒 Meu carrinho</span><small>${nItens()}</small></button>`;
}
function navTopo() {
  const as = areasComProd();
  $('#nv').innerHTML = `<button class="${isHome() ? 'on' : ''}" onclick="nav({a:'',s:'',m:'',q:''})">Início</button>${as.map(k => `<button class="${V.a == k ? 'on' : ''}" onclick="nav({a:'${k}',s:'',m:''})">${k}</button>`).join('')}<button onclick="irPara('marcas')">Marcas</button><span class="sp"></span><button onclick="abrirSug()">💡 Pedir um produto</button>`;
}

/* ---------- anúncios (carrossel editável) ---------- */
const temLink = a => a.link_tipo && a.link_tipo != 'nenhum';
function heroPadrao() {
  const nov = ordenar(P, 'novos'), fotos = nov.filter(p => p.foto).slice(0, 4);
  return `<section class="hero"><div class="tx"><span class="tg" style="position:static;background:none;padding:0;color:#bdbdc4;letter-spacing:.22em">ROZIVALDO STORE</span><h1>Moda, lingerie<br>e sex shop</h1><p>Marcas selecionadas, pagamento no Pix e atendimento direto com a loja. Escolha, monte seu carrinho e finalize em poucos toques.</p><button class="go" onclick="irPara('novidades')">VER NOVIDADES</button></div>
    <div class="col">${[0, 1, 2, 3].map(i => fotos[i] ? `<div style="background-image:url('${fotos[i].foto}')"></div>` : '<div class="ph0">🛍️</div>').join('')}</div></section>`;
}
function heroHtml() {
  const h = hojeISO(), l = AN.filter(a => a.ativo !== false && (!a.inicio || a.inicio <= h) && (!a.fim || a.fim >= h)).sort((a, b) => a.ordem - b.ordem);
  if (!l.length) return heroPadrao();
  const slide = a => { const k = temLink(a), bg = esc(a.cor_fundo || '#111111'), tx = esc(a.cor_texto || '#ffffff'), tag = k ? 'button' : 'div';

const fmtDH = d => { const x = new Date(d); return x.toLocaleDateString('pt-BR') + ' ' + x.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
function trackHtml() {

function trackRes(r) {
  const et = r.etapas || [], pos = r.etapa_pos || 1, hi = r.historico || [];
  const ult = (e, f) => [...hi].reverse().find(x => x.etapa_id == e.id && (!f || f(x)));
  const quando = (e, i) => { const h = ult(e); return h ? fmtDH(h.em) : i == 0 ? fmtDH(r.criado_em) : ''; };
  const pg = r.pagamento == 'pix_total' ? `Pix · valor total (${R(r.valor_pix)})` : r.pagamento == 'pix_entrada' ? `Pix · entrada de ${R(r.valor_pix)} (restante ${R(r.total - r.valor_pix)})` : 'Pagamento a combinar com a loja';
  const wa = waLoja();
  return `<div class="trr"><div class="trh"><div><small>Pedido</small><b>${esc(r.codigo)}</b></div><div style="text-align:right"><small>Olá${r.nome ? ', ' + esc(r.nome) : ''}! Etapa atual</small><b>${esc((et[pos - 1] || {}).nome || '')}</b></div></div>
  <div class="tl">${et.map((e, i) => { const n = i + 1, fim = n == pos && pos == et.length, st = n < pos || fim ? 'done' : n == pos ? 'cur' : '', q = n <= pos ? quando(e, i) : '', nt = n <= pos ? (ult(e, x => x.nota) || {}).nota : '';
    return `<div class="tli ${st}"><span class="dot">${n < pos || fim ? '✓' : n == pos ? '●' : n}</span><div><b>${esc(e.nome)}</b>${e.descricao ? `<small class="blk">${esc(e.descricao)}</small>` : ''}${q ? `<small class="blk">${q}</small>` : ''}${nt ? `<em>💬 ${esc(nt)}</em>` : ''}</div></div>`; }).join('')}</div>
  <div class="res"><b>Seu pedido</b>${(r.itens || []).map(i => `<div class="tr"><span>${i.qtd}× ${esc(i.nome)}</span><b>${R(i.qtd * i.preco)}</b></div>`).join('')}<div class="tr t"><span>Total</span><span>${R(r.total)}</span></div><small class="blk">${pg}</small></div>
  ${wa ? `<a class="btn w" style="margin-top:10px" target="_blank" rel="noopener" href="${wa}?text=${encodeURIComponent('Olá! Sobre o meu pedido ' + r.codigo)}">💬 Falar com a loja no WhatsApp</a>` : ''}<button class="btn alt w" style="margin-top:8px" onclick="trackBusca()">↻ Atualizar</button></div>`;
}
async function trackBusca(e) {
  if (e) { e.preventDefault(); const f = e.target; TR.codigo = f.codigo.value.trim().toUpperCase(); TR.tel = f.tel.value.trim(); }
  if (TR.codigo.length < 6 || TR.tel.replace(/\D/g, '').length < 8) { TR.erro = 'Informe o código do pedido e o seu WhatsApp com DDD.'; return render(); }
  TR.load = true; TR.erro = ''; render();
  const { data, error } = await db.rpc('acompanhar_pedido', { p_codigo: TR.codigo, p_telefone: TR.tel });
  TR.load = false;

  else if (!data) { TR.res = null; TR.erro = 'Não encontramos esse pedido. Confira o código e o WhatsApp usado na compra.'; }
  else { TR.res = data; try { localStorage.setItem('rs_ultimo', JSON.stringify({ c: TR.codigo, t: TR.tel })); } catch (x) {} }
  render();

  if (TR.auto) return; TR.auto = true;

}

  const p = P.find(x => x.id == GAL.id); if (!p) return; const s = $('#szs');
  if (s) s.innerHTML = p.tamanhos.map(t => `<button class="sz ${GAL.tam == t ? 'on' : ''}" data-t="${esc(t)}" onclick="tamPick(this.dataset.t)">${esc(t)}</button>`).join('');
  const b = $('#addb'), y = $('#buyb'), falta = temTam(p) && !GAL.tam;
  b.textContent = falta ? 'Escolha um tamanho' : 'Adicionar ao carrinho'; b.disabled = falta; y.disabled = falta;
}
function tamPick(t) { GAL.tam = GAL.tam == t ? '' : t; szDesenha(); }
function addDet(comprar) { const p = P.find(x => x.id == GAL.id); if (!p || (temTam(p) && !GAL.tam)) return; mud(keyOf(p.id, GAL.tam), 1); fecha(); if (comprar) ckAbrir(); else toast('Adicionado ao carrinho', 'Ver carrinho', 'abrirCarrinho()'); }
function fecha() { GAL.id = ''; $('#modal').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key == 'Escape') { if ($('#modal').innerHTML) fecha(); else { fechaCarrinho(); menu(false); } } if (GAL.id && $('#gal')) { if (e.key == 'ArrowRight') galGo(1); if (e.key == 'ArrowLeft') galGo(-1); } });

/* ---------- Pix (Copia e Cola) ---------- */
const semAcento = s => nz(s).toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim();
const emv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
function pixPayload(valor, txid) {
  const conta = emv('00', 'BR.GOV.BCB.PIX') + emv('01', PIX.chave);
  const p = emv('00', '01') + emv('01', '11') + emv('26', conta) + emv('52', '0000') + emv('53', '986') + (valor > 0 ? emv('54', valor.toFixed(2)) : '') + emv('58', 'BR') + emv('59', semAcento(PIX.nome).slice(0, 25)) + emv('60', semAcento(PIX.cidade).slice(0, 15)) + emv('62', emv('05', String(txid).replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***')) + '6304';
  return p + crc16(p);
}
function qrSvg(txt) { try { if (typeof qrcode !== 'function') return ''; const q = qrcode(0, 'M'); q.addData(txt); q.make(); return q.createSvgTag(4, 2); } catch (e) { return ''; } }
async function copiar(txt, btn) {
  try { await navigator.clipboard.writeText(txt); } catch (e) { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (x) {} t.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = '✓ Copiado!'; setTimeout(() => btn.textContent = o, 1800); }
}

/* ---------- finalizar pedido ---------- */
const numBR = v => { let s = String(v || '').trim().replace(/[^\d,.]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = +s; return isFinite(n) ? n : 0; };
function ckEntrada() {
  const t = total(); let v = CK.pct ? Math.round(t * CK.pct) / 100 : numBR(CK.outro);
  if (v > t - 0.01) v = Math.floor((t - 0.01) * 100) / 100;
  return v >= 1 ? Math.round(v * 100) / 100 : 0;
}
const stepBar = n => `<div class="stp">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div><small class="stl">${['Seus dados', 'Pagamento', 'Pix'][n - 1]} · passo ${n} de 3</small>`;
const ckResumo = () => `<div class="res">${linhas().map(x => `<div class="tr"><span>${x.q}× ${rotulo(x)}</span><b>${R(x.q * x.p.preco)}</b></div>`).join('')}<div class="tr t"><span>Total</span><span>${R(total())}</span></div></div>`;
function ckAbrir() {
  if (!linhas().length) return;
  fechaCarrinho(); CK = { passo: 1, nome: '', tel: '', obs: '', forma: 'pix_total', pct: 50, outro: '' }; ckTela();
}
function ckTela() {
  const t = total();
  const corpo = CK.passo == 1 ? `${stepBar(1)}${ckResumo()}
  <form id="ckd" onsubmit="ckPasso2(event)"><h3>Seus dados</h3>
  <input class="inp" name="nome" maxlength="80" placeholder="Seu nome completo" required autocomplete="name" value="${esc(CK.nome)}">
  <input class="inp" name="telefone" type="tel" maxlength="20" placeholder="Seu WhatsApp com DDD" required autocomplete="tel" value="${esc(CK.tel)}">
  <textarea class="inp" name="obs" rows="2" maxlength="300" placeholder="Endereço de entrega ou observações (opcional)">${esc(CK.obs)}</textarea>
  <button class="btn w" style="margin-top:10px">Continuar</button></form>`
  : `${stepBar(2)}${ckResumo()}
  <form id="ckf" onsubmit="ckEnviar(event)"><h3>Como você quer pagar?</h3>
  <label class="opt"><input type="radio" name="forma" value="pix_total" onchange="ckForma(this.value)"><span><b>Pix · valor total</b><small>Pague tudo agora e garanta suas peças</small></span><b>${R(t)}</b></label>
  <label class="opt"><input type="radio" name="forma" value="pix_entrada" onchange="ckForma(this.value)"><span><b>Pix · dar uma entrada</b><small>Pague uma parte agora e combine o restante</small></span><b id="ckev"></b></label>
  <div class="ent" id="ckent" hidden><small>Quanto você quer pagar agora?</small><div class="chs">${[30, 50, 70].map(p => `<button type="button" data-p="${p}" onclick="ckPct(${p})">${p}%</button>`).join('')}</div>
    <input class="inp" id="ckout" inputmode="decimal" placeholder="Ou digite outro valor (R$)" oninput="ckOutro(this.value)"><div id="ckinfo" style="margin-top:6px;font-size:.88rem"></div></div>
  <label class="opt"><input type="radio" name="forma" value="combinar" onchange="ckForma(this.value)"><span><b>Combinar com a loja</b><small>Outras formas de pagamento pelo WhatsApp</small></span></label>
  <button class="btn w" id="cksub" style="margin-top:14px">Gerar Pix</button><button type="button" class="btn alt w" style="margin-top:8px" onclick="CK.passo=1;ckTela()">← Voltar</button><small class="blk" style="display:block;text-align:center;margin-top:8px">Seus dados são usados só para este pedido.</small></form>`;
  $('#modal').innerHTML = `<div class="bk" onclick="if(event.target==this)fecha()"><div class="sheet ck"><div class="shh"><h2>Finalizar pedido</h2><button class="x" onclick="fecha()" aria-label="Fechar">✕</button></div>${corpo}</div></div>`;
  if (CK.passo == 2) { const r = document.querySelector('#ckf [name=forma][value="' + CK.forma + '"]'); if (r) r.checked = true; ckForma(CK.forma); }
}
function ckPasso2(e) {
  e.preventDefault(); const f = e.target;
  if (f.nome.value.trim().length < 2) return alert('Informe o seu nome.');
  if (f.telefone.value.replace(/\D/g, '').length < 10) return alert('Informe seu WhatsApp com DDD.');
  CK.nome = f.nome.value.trim(); CK.tel = f.telefone.value.trim(); CK.obs = f.obs.value.trim(); CK.passo = 2; ckTela();
}
function ckForma(v) {
  CK.forma = v; document.querySelectorAll('#ckf .opt').forEach(o => o.classList.toggle('on', o.querySelector('input').value == v)); $('#ckent').hidden = v != 'pix_entrada'; ckAtualiza();
}
function ckPct(p) { CK.pct = p; CK.outro = ''; $('#ckout').value = ''; ckAtualiza(); }
function ckOutro(v) { CK.pct = 0; CK.outro = v; ckAtualiza(); }
function ckAtualiza() {
  const t = total(), e = ckEntrada(), ent = CK.forma == 'pix_entrada';
  document.querySelectorAll('#ckent [data-p]').forEach(b => b.classList.toggle('on', CK.pct == +b.dataset.p));
  $('#ckev').textContent = ent && e ? R(e) : '';
  $('#ckinfo').innerHTML = ent ? (e ? `Entrada agora <b>${R(e)}</b> · Restante <b>${R(t - e)}</b> (combinamos pelo WhatsApp)` : '<span style="color:#dc2626">Informe uma entrada de pelo menos R$ 1,00 e menor que o total.</span>') : '';
  const b = $('#cksub'); b.textContent = CK.forma == 'combinar' ? 'Enviar pedido' : 'Gerar Pix · ' + R(CK.forma == 'pix_total' ? t : e); b.disabled = ent && !e;
}
async function ckEnviar(e) {
  e.preventDefault();
  const b = $('#cksub'), t = total(), ent = CK.forma == 'pix_entrada', valor = CK.forma == 'pix_total' ? t : ent ? ckEntrada() : 0;
  if (!linhas().length) return;
  if (ent && !valor) return alert('Informe o valor da entrada.');
  b.disabled = true; const txt = b.textContent; b.textContent = 'Enviando…';
  const itens = linhas().map(x => ({ id: x.p.id, nome: x.p.nome + (x.tam ? ' · ' + x.tam : x.p.tam_consulta ? ' · tam. a confirmar' : ''), categoria: x.p.categoria, qtd: x.q, preco: Number(x.p.preco), tam: x.tam || null }));
  let codigo = 'RS' + mkId(8), r;
  for (let i = 0; i < 3; i++) {
    r = await db.from('pedidos').insert({ nome: CK.nome, telefone: CK.tel, itens, total: t, status: 'novo', pagamento: CK.forma, valor_pix: valor || null, pix_txid: valor ? codigo : null, codigo, obs: CK.obs || null });
    if (r.error && /duplicate|unique/i.test(r.error.message || '')) { codigo = 'RS' + mkId(8); continue; }
    break;
  }
  if (r.error) { b.disabled = false; b.textContent = txt; return alert('Não foi possível enviar o pedido agora. Tente de novo em instantes.'); }
  try { localStorage.setItem('rs_ultimo', JSON.stringify({ c: codigo, t: CK.tel })); } catch (x) {}
  const ped = { nome: CK.nome, telefone: CK.tel, total: t, pagamento: CK.forma, valor_pix: valor || null };
  cart = {}; salvaCart(); updHeader(); cartRender(); render(); TR = { codigo: '', tel: '', res: null, erro: '', load: false, auto: false };
  if (CK.forma == 'combinar') return ckOk(ped, codigo);
  ckPix(ped, codigo);
}
function zapLoja(txt) { const d = whats().replace(/\D/g, ''); return d ? `https://wa.me/${d.length <= 11 ? '55' + d : d}?text=${encodeURIComponent(txt)}` : ''; }
const btnAcomp = c => `<button class="btn alt w" style="margin-top:8px" onclick="fecha();nav({v:'acompanhar',c:'${c}'})">📦 Acompanhar este pedido</button>`;
function ckOk(p, codigo) {
  const wa = zapLoja(`Olá! Fiz o pedido ${codigo} no catálogo (${R(p.total)}) e quero combinar o pagamento. Meu nome: ${p.nome}`);
  $('#modal').innerHTML = `<div class="bk"><div class="sheet pixb">${stepBar(3)}<h2>Pedido enviado! 💜</h2><p class="mut">Recebemos seu pedido de ${R(p.total)}. Vamos te chamar no WhatsApp para combinar o pagamento e a entrega.</p><div class="res"><small>Guarde o código do seu pedido</small><div style="font-size:1.5rem;font-weight:800;letter-spacing:.06em">${codigo}</div></div>${wa ? `<a class="btn w" style="margin-top:10px" target="_blank" href="${wa}">Falar com a loja no WhatsApp</a>` : ''}${btnAcomp(codigo)}<button class="btn alt w" style="margin-top:8px" onclick="fecha()">Voltar ao catálogo</button></div></div>`;
}
function ckPix(p, codigo) {
  const cod = pixPayload(p.valor_pix, codigo), qr = qrSvg(cod), restante = Math.round((p.total - p.valor_pix) * 100) / 100;
  const wa = zapLoja(`Olá! Fiz o pedido ${codigo} e paguei ${R(p.valor_pix)} no Pix. Segue o comprovante:`);
  window._pix = { cod, chave: PIX.chave };
  $('#modal').innerHTML = `<div class="bk"><div class="sheet pixb"><div class="shh"><h2>Pague com Pix</h2><button class="x" onclick="fecha()" aria-label="Fechar">✕</button></div>${stepBar(3)}
  <small>Pedido <b>${codigo}</b> · ${p.pagamento == 'pix_entrada' ? 'Entrada' : 'Valor total'}</small><div class="v">${R(p.valor_pix)}</div>
  ${qr ? `<div class="qr">${qr}</div><small>Aponte a câmera do app do seu banco para o QR Code</small>` : ''}
  <h3 style="text-align:left">Pix Copia e Cola</h3><textarea class="cola" readonly onclick="this.select()">${cod}</textarea>
  <button class="btn w" style="margin-top:8px" onclick="copiar(window._pix.cod,this)">Copiar código Pix</button>
  <ol class="steps"><li>Abra o app do seu banco e vá em <b>Pix</b>.</li><li>Escolha <b>Pix Copia e Cola</b> (ou leia o QR Code).</li><li>Cole o código, confira o valor <b>${R(p.valor_pix)}</b> e o nome <b>${esc(PIX.nome)}</b> e pague.</li></ol>
  <small>Ou use a chave Pix (aleatória):</small><div class="tr" style="gap:8px"><code style="font-size:.74rem;word-break:break-all;text-align:left">${PIX.chave}</code><button class="btn alt" style="padding:8px 12px" onclick="copiar(window._pix.chave,this)">Copiar</button></div>
  ${restante > 0.009 ? `<div class="res" style="margin-top:12px">Restante do pedido: <b>${R(restante)}</b>. Combinamos o pagamento pelo WhatsApp.</div>` : ''}
  <div class="res" style="margin-top:12px"><small>Guarde o código do seu pedido para acompanhar</small><div style="font-size:1.35rem;font-weight:800;letter-spacing:.06em">${codigo}</div></div>
  <p class="mut" style="font-size:.84rem">Depois de pagar, ${wa ? 'envie o comprovante pelo WhatsApp' : 'a loja confirma o recebimento e te chama no WhatsApp'}. 💜</p>
  ${wa ? `<a class="btn w" target="_blank" href="${wa}">Enviar comprovante no WhatsApp</a>` : ''}${btnAcomp(codigo)}<button class="btn alt w" style="margin-top:8px" onclick="fecha()">Voltar ao catálogo</button></div></div>`;
}

/* ---------- pedir um produto (sugestões) ---------- */
function abrirSug(pre) {
  $('#modal').innerHTML = `<div class="bk" onclick="if(event.target==this)fecha()"><div class="sheet"><div class="shh"><h2>💡 Pedir um produto</h2><button class="x" onclick="fecha()" aria-label="Fechar">✕</button></div>
  <p class="mut" style="margin-top:0">Não achou o que queria? Conte pra gente e vamos tentar trazer!</p>
  <form onsubmit="enviaSug(event)">
  <input class="inp" name="produto" maxlength="120" placeholder="O que você procura? (ex: short jeans, perfume...)" value="${esc(pre || '')}" required>
  <select class="inp" name="categoria"><option value="">Categoria (opcional)</option>${CATS.map(k => `<option>${k}</option>`).join('')}</select>
  <textarea class="inp" name="detalhes" rows="3" maxlength="500" placeholder="Detalhes: cor, tamanho, marca... (opcional)"></textarea>
  <input class="inp" name="nome" maxlength="80" placeholder="Seu nome (opcional)">
  <input class="inp" name="telefone" type="tel" maxlength="20" placeholder="Seu WhatsApp para avisarmos quando chegar (opcional)">
  <input name="site" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
  <button class="btn w" style="margin-top:6px">Enviar pedido</button><p class="mut" style="font-size:.74rem;text-align:center">Usamos seu contato apenas para avisar sobre este pedido.</p></form></div></div>`;
}
async function enviaSug(e) {
  e.preventDefault();
  const f = e.target, b = f.querySelector('button');
  if (f.site.value) return sugOk();
  let h = []; try { h = JSON.parse(localStorage.getItem('rs_sug') || '[]').filter(t => Date.now() - t < 3600000); } catch (x) {}
  if (h.length >= 5) return alert('Você já enviou vários pedidos. Tente novamente mais tarde, obrigada! 💜');
  b.disabled = true; b.textContent = 'Enviando…';
  const v = n => f[n].value.trim() || null;
  const { error } = await db.from('sugestoes').insert({ produto: v('produto'), categoria: v('categoria'), detalhes: v('detalhes'), nome: v('nome'), telefone: v('telefone'), status: 'nova' });
  if (error) { b.disabled = false; b.textContent = 'Enviar pedido'; return alert('Não foi possível enviar agora. Tente de novo em instantes.'); }
  try { localStorage.setItem('rs_sug', JSON.stringify([...h, Date.now()])); } catch (x) {}
  sugOk(!!v('telefone'));
}
function sugOk(tel) {
  $('#modal').innerHTML = `<div class="bk"><div class="sheet pixb"><h2>Pedido enviado! 💜</h2><p class="mut">Obrigada! Anotamos o seu pedido${tel ? ' e vamos te avisar pelo WhatsApp quando chegar' : ''}. Sua opinião ajuda a escolher as novidades da loja.</p><button class="btn w" onclick="fecha()">Voltar ao catálogo</button></div></div>`;
}
init();
</script>
</body>
</html>
