<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rozivaldo Store</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v14c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-14c-4 0-6.5.5-8 2zM12 6.5v14"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8 15.8 7.2M8.2 13.2l7.6 3.6"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 .7c-1-.4-2-1.4-2.4-2.4l.7-1-1-2z"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/></symbol>
  <symbol id="i-ai" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 16l3-7 3 7M10 14h4"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M8 16l4-5 3 3 5-7"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
</svg>

<div id="login" class="max-w-sm mx-auto mt-24 p-4" hidden>
  <h1 class="text-3xl font-extrabold mb-4">Rozivaldo Store</h1>
  <form id="lf">
    <input id="em" type="email" class="inp" placeholder="E-mail" required>
    <input id="pw" type="password" class="inp" placeholder="Senha" required>
    <button class="btn w">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="logo">
      <svg viewBox="0 0 64 64" width="54" height="54"><path d="M14 22h36l-3 34H17z" fill="none" stroke="#cbd5e1" stroke-width="2.5"/><path d="M24 22v-6a8 8 0 0 1 16 0v6" fill="none" stroke="#cbd5e1" stroke-width="2.5"/><text x="32" y="47" text-anchor="middle" font-size="22" font-weight="800" fill="#cbd5e1" font-family="sans-serif">R</text></svg>
      <div><b>ROZIVALDO</b> STORE</div><small>MODA · LINGERIE · SEX SHOP</small>
    </div>

    <button data-nav="inicio" onclick="go('inicio')"><svg class="ic"><use href="#i-home"/></svg>Início</button>
    <button data-nav="dash" onclick="go('dash')"><svg class="ic"><use href="#i-grid"/></svg>Dashboard</button>
    <button data-nav="clientes" onclick="go('clientes')"><svg class="ic"><use href="#i-user"/></svg>Clientes</button>

    <details open><summary><svg class="ic"><use href="#i-book"/></svg>Catálogo</summary>
      <button data-nav="catalogo" onclick="go('catalogo')"><svg class="ic"><use href="#i-share"/></svg>Catálogo Digital Inteligente</button>
      <button data-nav="vitrine" onclick="go('vitrine')"><svg class="ic"><use href="#i-zap"/></svg>Vitrine Interativa WhatsApp</button>
    </details>

    <details open><summary><svg class="ic"><use href="#i-cart"/></svg>Vendas</summary>
      <button data-nav="venda" onclick="go('venda')">Nova Venda</button>
      <button data-nav="historico" onclick="go('historico')">Histórico</button>
      <button onclick="audio()">Registro Rápido por Voz <span class="mic"><svg class="ic"><use href="#i-mic"/></svg></span></button>
    </details>

    <details open><summary><svg class="ic"><use href="#i-ai"/></svg>Assistente IA</summary>
      <button onclick="audio()">Vendas por Áudio <span class="mic"><svg class="ic"><use href="#i-mic"/></svg></span></button>
      <button onclick="lancar()">Lançar Venda <span class="mic"><svg class="ic"><use href="#i-mic"/></svg></span></button>
    </details>

    <details><summary><svg class="ic"><use href="#i-wallet"/></svg>Financeiro</summary>
      <button data-nav="financeiro" onclick="go('financeiro')">Parcelas</button>
      <button data-nav="recebimentos" onclick="go('recebimentos')">Recebimentos</button>
      <button data-nav="contas" onclick="go('contas')">Contas a pagar</button>
    </details>

    <button data-nav="relatorio" onclick="go('relatorio')"><svg class="ic"><use href="#i-chart"/></svg>Relatórios</button>
    <button data-nav="ajustes" onclick="go('ajustes')"><svg class="ic"><use href="#i-gear"/></svg>Configurações</button>
    <button onclick="sair()"><svg class="ic"><use href="#i-out"/></svg>Sair</button>
  </aside>

  <div id="col">
    <header id="top">
      <button class="burger" onclick="menu()">☰</button>
      <span class="tb-brand">ROZIVALDO STORE</span>
      <button class="bell" onclick="go('pedidos')" title="Pedidos online"><svg class="ic" style="width:20px;height:20px"><use href="#i-bell"/></svg><b id="pbadge" hidden></b></button>
      <button class="avatar" onclick="go('ajustes')" title="Configurações">R</button>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="modal"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
